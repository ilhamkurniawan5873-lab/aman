<!DOCTYPE html>
<html>
<head>
  <title>Pencarian Produk Aman - 24781043</title>
</head>
<body>
  <h2>Pencarian Produk (Aman)</h2>
  <input type="text" id="searchInput" placeholder="Cari produk...">
  <button onclick="search()">Cari</button>
  <div id="results"></div>

  <script>
    const products = [
      { id: 1, name: "Laptop", user: "admin", price: 1000 },
      { id: 2, name: "Mouse", user: "user", price: 50 }
    ];

    function search() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      // Aman: Menggunakan pencocokan string statis tanpa eval/eksekusi logika
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = filtered.length > 0 
        ? filtered.map(p => `<p>${p.name} - $${p.price}</p>`).join('')
        : '<p>Produk tidak ditemukan.</p>';
    }
  </script>
</body>
</html>
